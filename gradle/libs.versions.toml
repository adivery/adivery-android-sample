[versions]
agp = "9.4.0"
# AGP 9 brings its own Kotlin, but the Compose compiler plugin is a separate artifact that has to be
# pinned to that same Kotlin version. `./gradlew :app:dependencies` reports it as kotlin-stdlib.
kotlin = "2.2.10"
adivery = "4.9.0"

# The Adivery SDK supports minSdk 21, so this sample does too. Everything below is the newest release
# that still ships minSdkVersion 21
coreKtx = "1.17.0"
appcompat = "1.7.1"
activity = "1.11.0"
composeBom = "2025.11.01"
material = "1.13.0"
media3 = "1.8.1"
playServicesAdsIdentifier = "18.0.1"

junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
adivery-sdk = { module = "com.adivery:sdk", version.ref = "adivery" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-exoplayer-ima = { module = "androidx.media3:media3-exoplayer-ima", version.ref = "media3" }
play-services-ads-identifier = { module = "com.google.android.gms:play-services-ads-identifier", version.ref = "playServicesAdsIdentifier" }
junit ={ module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
